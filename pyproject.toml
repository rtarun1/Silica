[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Silica"
version = "0.1.0"
description = "Silica deps"
requires-python = ">=3.10,<=3.12"
dependencies = [
    "accelerate==0.29.3",
    "bitsandbytes",
    "datasets",
    "diffusers==0.28.0",
    "ftfy",
    "geffnet",
    "h5py",
    "huggingface-hub",
    "numpy<2",
    "pandas<2",
    "omegaconf",
    "opencv-python",
    "peft==0.7.0",
    "spaces",
    "tabulate",
    "torch==2.9.0",
    "torchmetrics",
    "torchvision",
    "transformers==4.40.1",
    "wandb",
    "xformers",
    "open3d"
]

[tool.setuptools.packages.find]
where = ["src"]
