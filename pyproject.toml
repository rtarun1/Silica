[project]
name = "Silica"
version = "0.1.0"
description = "Silica deps"
requires-python = ">=3.10,<=3.12"
dependencies = [
    "accelerate",
    "bitsandbytes",
    "datasets",
    "diffusers",
    "easydict",
    "ftfy",
    "geffnet",
    "gradio",
    "gradio-client",
    "gradio-imageslider",
    "h5py",
    "huggingface-hub",
    "imageio",
    "imageio-ffmpeg",
    "numpy<2",
    "omegaconf",
    "opencv-python",
    "peft",
    "spaces",
    "tabulate",
    "torch<2.10",
    "torchmetrics",
    "torchvision",
    "transformers",
    "wandb",
    "xformers",
    "open3d"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["infer", "model"]